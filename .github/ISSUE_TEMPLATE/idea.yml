name: Idea or request
description: Something you would like the village to do
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see or do? Why would it make the world better?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, games or books that do it well, or how you imagine it working.
